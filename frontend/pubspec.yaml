name: front_prestamo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  google_fonts: ^6.2.1
  image_picker: ^1.2.4
  gal: ^2.3.3
  pdfrx: ^2.13.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imagenes/Logo_Icono_telefono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#22130C"
  adaptive_icon_foreground: "assets/imagenes/Logo_Icono_telefono.png"

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
    - assets/manuales/manual_administrador.pdf
    - assets/manuales/manual_usuario.pdf